name: Daily Oracle Fusion Readiness Update Check

on:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Print raw fetch diagnostics (status, link counts, HTML sample) to the run log"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scm-update
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check for Oracle Fusion readiness updates (SCM/Finance/PPM)
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEBUG_SCRAPE: ${{ github.event.inputs.debug }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_scm_updates.py

      - name: Commit updated snapshot and report(s)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json updates/ CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Daily readiness check: ${{ steps.check.outputs.new_item_count || 0 }} new page(s) on $(date -u +'%Y-%m-%d') [${{ steps.check.outputs.categories }}]"
            git push
          fi
