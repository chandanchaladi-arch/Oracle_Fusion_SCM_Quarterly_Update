name: Daily Oracle Fusion SCM Update Check

on:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Print raw fetch diagnostics (status, link counts, HTML sample) to the run log"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scm-update
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check for Oracle Fusion SCM readiness updates
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEBUG_SCRAPE: ${{ github.event.inputs.debug }}
        run: python scripts/check_scm_updates.py

      - name: Commit updated snapshot and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json updates/ CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Daily SCM readiness check: ${{ steps.check.outputs.new_item_count || 0 }} new page(s) on $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Ensure label exists
        if: steps.check.outputs.changes_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "oracle-scm-update" \
            --color BFD4F2 \
            --description "Automated Oracle Fusion SCM readiness update" \
            --force

      - name: Open GitHub issue with summary
        if: steps.check.outputs.changes_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Oracle Fusion SCM updates - $(date -u +'%Y-%m-%d') (${{ steps.check.outputs.new_item_count }} new)" \
            --body-file "${{ steps.check.outputs.summary_file }}" \
            --label "oracle-scm-update"
