name: Build Latest SCM Update Summary

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build summaries (SCM, Finance, PPM, AI, Redwood)
        run: python scripts/build_latest_summary.py

      - name: Send each category to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for category in SCM Finance PPM AI Redwood; do
            python scripts/send_telegram.py "docs/Latest_Update_Summary_${category}_telegram.txt" \
              --document "docs/Latest_Update_Summary_${category}.md"
          done

      - name: Commit summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Latest_Update_Summary_*.md docs/Latest_Update_Summary_*_telegram.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Rebuild latest readiness summaries (SCM/Finance/PPM/AI/Redwood)"
            git push
          fi
