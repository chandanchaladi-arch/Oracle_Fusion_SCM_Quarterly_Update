name: Telegram On-Demand Update

on:
  schedule:
    # Every 5 minutes -- GitHub Actions' practical minimum for scheduled
    # workflows. Actual firing can lag behind this during high load, so
    # a reply isn't instant like a live chatbot.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-on-demand
  cancel-in-progress: false

jobs:
  poll-and-respond:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Poll Telegram and reply if someone asked for an update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_on_demand.py

      - name: Commit offset and any rebuilt summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          git add data/telegram_offset.json docs/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Telegram on-demand update"
            git push
          fi
